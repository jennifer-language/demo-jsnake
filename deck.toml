[package]
name = "jsnake"
version = "0.1.0"
description = "Multiplayer snake game for Linux console, written in Jennifer, over UDP/TCP, with UDP discovery, CPU opponents, special food."
license = "LGPL-3.0-only"
authors = ["mplx <jennifer@mplx.dev>"]
keywords = ["game", "snake", "terminal", "multiplayer", "tui"]
bin = "bin/jsnake"
capabilities = ["net"]

[package.urls]
deck = "https://raw.githubusercontent.com/jennifer-language/demo-jsnake/main/deck.toml"
homepage = "https://github.com/jennifer-language/demo-jsnake"

[engines]
jennifer = ">=0.25.0"

[decks]

[provides]
jsnake = "0.1.0"
